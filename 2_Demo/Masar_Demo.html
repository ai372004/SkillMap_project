c`,text:{ar:`Universal Exchange`,en:`Universal Exchange`}},{id:`d`,text:{ar:`Unified Execution`,en:`Unified Execution`}}],answer:`b`,explain:{ar:`UX هي تجربة المستخدم: كل ما يشعر به المستخدم أثناء استخدام المنتج.`,en:`UX is User Experience: everything a person feels while using a product.`}},{id:`ux2`,difficulty:`easy`,q:{ar:`أي أداة تُستخدم أساسًا لتصميم الواجهات والنماذج الأولية؟`,en:`Which tool is mainly used to design interfaces and prototypes?`},options:[{id:`a`,text:{ar:`MySQL`,en:`MySQL`}},{id:`b`,text:{ar:`Postman`,en:`Postman`}},{id:`c`,text:{ar:`Figma`,en:`Figma`}},{id:`d`,text:{ar:`Excel`,en:`Excel`}}],answer:`c`,explain:{ar:`Figma أداة تصميم واجهات ونماذج أولية تعمل في المتصفح وتدعم العمل الجماعي.`,en:`Figma is a browser-based interface design and prototyping tool built for teamwork.`}},{id:`ux3`,difficulty:`easy`,q:{ar:`ما المقصود بالـ Wireframe؟`,en:`What is a wireframe?`},options:[{id:`a`,text:{ar:`مخطط مبسّط للشاشة يوضح الهيكل وترتيب العناصر`,en:`A simple screen layout showing structure and element placement`}},{id:`b`,text:{ar:`تصميم نهائي عالي الدقة بالألوان والصور النهائية`,en:`A finished, high-fidelity mockup with final colours and images`}},{id:`c`,text:{ar:`دليل الهوية الذي يحدد ألوان العلامة وخطوطها وقواعد الشعار`,en:`The style guide listing the brand's colours, fonts and logo rules`}},{id:`d`,text:{ar:`كود الواجهة الأمامية الذي يبني هيكل الصفحة بلغة HTML`,en:`The front-end code that builds the page structure in HTML`}}],answer:`a`,explain:{ar:`الـ Wireframe نسخة منخفضة الدقة تركز على الهيكل قبل الألوان والتفاصيل.`,en:`A wireframe is a low-fidelity version that focuses on structure before colours and details.`}},{id:`ux4`,difficulty:`easy`,q:{ar:`لماذا يستخدم المصممون المساحات البيضاء (Whitespace)؟`,en:`Why do designers use whitespace?`},options:[{id:`a`,text:{ar:`لتقليل حجم الملف وجعل الصفحة تُحمَّل أسرع`,en:`To reduce the file size and make pages load faster`}},{id:`b`,text:{ar:`لإخفاء محتوى لا يحتاجه إلا بعض المستخدمين`,en:`To hide content that only some users need to see`}},{id:`c`,text:{ar:`لملء الشاشة عندما لا يكون هناك محتوى كافٍ لعرضه`,en:`To fill the screen when there is not enough content to show`}},{id:`d`,text:{ar:`لتحسين القراءة وتوجيه انتباه المستخدم`,en:`To improve readability and guide the user's attention`}}],answer:`d`,explain:{ar:`المسافات تفصل العناصر وتريح العين وتبرز المحتوى المهم.`,en:`Space separates elements, rests the eye and highlights what matters.`}},{id:`ux5`,difficulty:`easy`,q:{ar:`ما الـ Persona في تجربة المستخدم؟`,en:`What is a persona in UX?`},options:[{id:`a`,text:{ar:`الملف الشخصي للمصمم الذي يوقّع به الملفات النهائية`,en:`The designer's own profile, used to sign the final files`}},{id:`b`,text:{ar:`شخصية افتراضية تمثل فئة من المستخدمين بناءً على البحث`,en:`A fictional character representing a group of users, based on research`}},{id:`c`,text:{ar:`الشخصية الكرتونية للعلامة التي تظهر في إعلاناتها`,en:`The brand's mascot that appears in its marketing`}},{id:`d`,text:{ar:`عميل حقيقي يختاره الفريق ليراجع كل قرار تصميم ويوافق عليه`,en:`A real customer the team chooses to review and approve every design decision`}}],answer:`b`,explain:{ar:`الـ Persona تساعد الفريق على تذكر احتياجات المستخدم الحقيقي وأهدافه.`,en:`A persona keeps the team focused on real users' needs and goals.`}},{id:`ux6`,difficulty:`medium`,q:{ar:`أي قانون يقول إن المستخدمين يفضلون أن يعمل موقعك مثل المواقع التي اعتادوا عليها؟`,en:`Which law says users prefer your site to work like the sites they already know?`},options:[{id:`a`,text:{ar:`قانون فيتس (Fitts)`,en:`Fitts's Law`}},{id:`b`,text:{ar:`قانون هيك (Hick)`,en:`Hick's Law`}},{id:`c`,text:{ar:`قانون جاكوب (Jakob)`,en:`Jakob's Law`}},{id:`d`,text:{ar:`قانون ميلر (Miller)`,en:`Miller's Law`}}],answer:`c`,explain:{ar:`قانون جاكوب: المستخدم يقضي معظم وقته في مواقع أخرى، فيتوقع أن يعمل موقعك بالطريقة نفسها.`,en:`Jakob's Law: users spend most of their time on other sites, so they expect yours to work the same way.`}},{id:`ux7`,difficulty:`medium`,q:{ar:`ماذا يقترح قانون فيتس (Fitts's Law)؟`,en:`What does Fitts's Law suggest?`},options:[{id:`a`,text:{ar:`أن تكون الأزرار المهمة كبيرة وسهلة الوصول`,en:`Important buttons should be large and easy to reach`}},{id:`b`,text:{ar:`أن تستخدم الواجهة أقل عدد ممكن من الألوان في كل شاشة`,en:`Interfaces should use as few colours as possible on each screen`}},{id:`c`,text:{ar:`ألا تحتوي القوائم على أكثر من سبعة عناصر أبدًا`,en:`Menus should never contain more than seven items`}},{id:`d`,text:{ar:`أن يكون نص الفقرات في منتصف الصفحة دائمًا`,en:`Body text should always be centred on the page`}}],answer:`a`,explain:{ar:`زمن الوصول لهدف يعتمد على حجمه وبُعده، فالهدف الأكبر والأقرب أسرع.`,en:`Time to reach a target depends on its size and distance, so bigger and closer is faster.`}},{id:`ux8`,difficulty:`medium`,q:{ar:`ما الهدف الأساسي من اختبار قابلية الاستخدام (Usability Testing)؟`,en:`What is the main goal of usability testing?`},options:[{id:`a`,text:{ar:`تشغيل الكود لاكتشاف الأخطاء البرمجية قبل الإطلاق`,en:`Running the code to find bugs before release`}},{id:`b`,text:{ar:`قياس سرعة استجابة الخادم تحت الضغط`,en:`Measuring how fast the server responds under load`}},{id:`c`,text:{ar:`سؤال المستخدمين عن الألوان والأشكال التي يفضلونها`,en:`Asking users which colours and styles they like most`}},{id:`d`,text:{ar:`ملاحظة مستخدمين حقيقيين أثناء أداء مهام لاكتشاف المشكلات`,en:`Watching real users perform tasks to find problems`}}],answer:`d`,explain:{ar:`مشاهدة المستخدم وهو يحاول تكشف مواضع الحيرة التي لا يراها المصمم.`,en:`Watching users try things reveals confusion the designer cannot see.`}},{id:`ux9`,difficulty:`medium`,q:{ar:`ما الحد الأدنى لنسبة التباين للنص العادي حسب معيار WCAG AA؟`,en:`What is the minimum contrast ratio for normal text under WCAG AA?`},options:[{id:`a`,text:{ar:`2:1`,en:`2:1`}},{id:`b`,text:{ar:`4.5:1`,en:`4.5:1`}},{id:`c`,text:{ar:`3:1`,en:`3:1`}},{id:`d`,text:{ar:`10:1`,en:`10:1`}}],answer:`b`,explain:{ar:`4.5:1 للنص العادي، و3:1 للنص الكبير، و7:1 لمستوى AAA.`,en:`4.5:1 for normal text, 3:1 for large text, and 7:1 for level AAA.`}},{id:`ux10`,difficulty:`medium`,q:{ar:`ما نظام التصميم (Design System)؟`,en:`What is a design system?`},options:[{id:`a`,text:{ar:`برنامج يشغّل أدوات التصميم على الحاسوب`,en:`A program that runs design tools on the computer`}},{id:`b`,text:{ar:`أداة لتنظيم المهام والمواعيد في فريق التصميم`,en:`A tool for planning tasks and deadlines in a design team`}},{id:`c`,text:{ar:`مجموعة مكونات وأنماط وإرشادات قابلة لإعادة الاستخدام`,en:`A collection of reusable components, styles and guidelines`}},{id:`d`,text:{ar:`مجلد مشترك يضم كل الشاشات المصممة لمشروع واحد`,en:`A shared folder holding all the screens designed for one project`}}],answer:`c`,explain:{ar:`يوحّد شكل المنتج ويسرّع العمل لأن الفريق يعيد استخدام نفس المكونات.`,en:`It keeps a product consistent and speeds up work because the team reuses the same parts.`}},{id:`ux11`,difficulty:`hard`,q:{ar:`ماذا ينص قانون هيك (Hick's Law)؟`,en:`What does Hick's Law state?`},options:[{id:`a`,text:{ar:`زمن اتخاذ القرار يزيد بزيادة عدد الخيارات وتعقيدها`,en:`Decision time increases with the number and complexity of choices`}},{id:`b`,text:{ar:`الأهداف الأكبر والأقرب أسرع في الضغط عليها`,en:`Larger, closer targets are faster to click`}},{id:`c`,text:{ar:`المستخدمون يتصفحون صفحات الويب على شكل حرف F`,en:`Users scan web pages in an F-shaped pattern`}},{id:`d`,text:{ar:`الإنسان يحتفظ بنحو سبعة عناصر في ذاكرته القصيرة في الوقت نفسه`,en:`People can hold about seven items in their short-term memory at once`}}],answer:`a`,explain:{ar:`لذلك نقلل الخيارات أو نقسمها إلى خطوات حتى لا يتردد المستخدم.`,en:`That is why we reduce choices or split them into steps so users don't hesitate.`}},{id:`ux12`,difficulty:`hard`,q:{ar:`ما ترتيب المراحل الأربع في نموذج الماسة المزدوجة (Double Diamond)؟`,en:`What is the order of the four phases in the Double Diamond model?`},options:[{id:`a`,text:{ar:`Design، Develop، Debug، Deploy`,en:`Design, Develop, Debug, Deploy`}},{id:`b`,text:{ar:`Define، Discover، Deliver، Develop`,en:`Define, Discover, Deliver, Develop`}},{id:`c`,text:{ar:`Research، Sketch، Code، Test`,en:`Research, Sketch, Code, Test`}},{id:`d`,text:{ar:`Discover، Define، Develop، Deliver`,en:`Discover, Define, Develop, Deliver`}}],answer:`d`,explain:{ar:`الماسة الأولى لفهم المشكلة (اكتشاف ثم تحديد)، والثانية لحلها (تطوير ثم تسليم).`,en:`The first diamond understands the problem (discover, define), the second solves it (develop, deliver).`}},{id:`ux13`,difficulty:`hard`,q:{ar:`فيمَ يُستخدم أسلوب فرز البطاقات (Card Sorting) أساسًا؟`,en:`What is card sorting mainly used for?`},options:[{id:`a`,text:{ar:`اختيار لوحة ألوان تناسب هوية العلامة`,en:`Choosing a colour palette that matches the brand`}},{id:`b`,text:{ar:`تصميم بنية المعلومات وقوائم التنقل أو تقييمها`,en:`Designing or evaluating information architecture and navigation`}},{id:`c`,text:{ar:`قياس الوقت الذي تستغرقه كل صفحة في التحميل`,en:`Measuring how long each page takes to load`}},{id:`d`,text:{ar:`تحديد ترتيب البطاقات التي تظهر في الصفحة الرئيسية بصريًا`,en:`Deciding the visual order of the cards that appear on the home page`}}],answer:`b`,explain:{ar:`يرتب المستخدمون المواضيع في مجموعات، فنعرف كيف يتوقعون تنظيم المحتوى.`,en:`Users group topics themselves, showing how they expect content to be organised.`}},{id:`ux14`,difficulty:`hard`,q:{ar:`ما فائدة خاصية Auto Layout في Figma؟`,en:`What is the benefit of Auto Layout in Figma?`},options:[{id:`a`,text:{ar:`تولّد لوحة ألوان كاملة من لون واحد للعلامة`,en:`It generates a full colour palette from one brand colour`}},{id:`b`,text:{ar:`تحوّل التصميم كله إلى كود واجهة أمامية جاهز يسلَّم للمبرمجين`,en:`It converts the whole design into production-ready front-end code for developers`}},{id:`c`,text:{ar:`تجعل الإطار يغيّر حجمه ويرتب محتواه تلقائيًا عند تغيّر المحتوى`,en:`Frames resize and arrange their content automatically when content changes`}},{id:`d`,text:{ar:`تحفظ نسخة جديدة من الملف مع كل تعديل`,en:`It saves a new version of the file every time you edit`}}],answer:`c`,explain:{ar:`مثلًا الزر يكبر تلقائيًا مع طول النص، وهي قريبة من فكرة Flexbox في CSS.`,en:`For example a button grows with its label; it is close to how Flexbox works in CSS.`}},{id:`ux15`,difficulty:`hard`,q:{ar:`ما الفرق بين التقييم الاستدلالي (Heuristic Evaluation) واختبار قابلية الاستخدام؟`,en:`What is the difference between a heuristic evaluation and a usability test?`},options:[{id:`a`,text:{ar:`يجريه خبراء وفق مبادئ معروفة، واختبار قابلية الاستخدام يشارك فيه مستخدمون حقيقيون`,en:`Experts check against known principles; a usability test uses real users`}},{id:`b`,text:{ar:`هما الطريقة نفسها، والاختلاف في الاسم فقط`,en:`They are the same method; only the name differs`}},{id:`c`,text:{ar:`التقييم الاستدلالي يعتمد على التحليلات فقط، واختبار قابلية الاستخدام يعتمد على الاستبيانات`,en:`A heuristic evaluation uses analytics only; a usability test uses surveys`}},{id:`d`,text:{ar:`التقييم الاستدلالي يشارك فيه مستخدمون حقيقيون، واختبار قابلية الاستخدام يجريه خبراء`,en:`A heuristic evaluation involves real users; a usability test is done by experts`}}],answer:`a`,explain:{ar:`الأول سريع ورخيص، والثاني يكشف مشكلات لا يتوقعها الخبراء. الأفضل استخدامهما معًا.`,en:`The first is quick and cheap; the second finds problems experts don't expect. Use both.`}}],tasks:[{id:`ux-t1`,level:`beginner`,title:{ar:`إعادة تصميم شاشة تسجيل دخول`,en:`Redesign a login screen`},description:{ar:`اختر شاشة تسجيل دخول من تطبيق تستخدمه، واكتب 3 مشكلات فيها، ثم أعد تصميمها في Figma مع توضيح سبب كل تعديل.`,en:`Pick a login screen from an app you use, list 3 problems in it, then redesign it in Figma and explain the reason for each change.`},deliverable:{ar:`رابط ملف Figma يحتوي الشاشة الأصلية والتصميم الجديد والملاحظات`,en:`A Figma link with the original screen, your redesign and your notes`}},{id:`ux-t2`,level:`beginner`,title:{ar:`لوحة إلهام ودليل أسلوب لتطبيق مقهى`,en:`Mood board and style guide for a café app`},description:{ar:`اصنع لوحة إلهام (Mood Board) لتطبيق مقهى خيالي، ثم استخرج منها دليل أسلوب: لوحة ألوان، خطين، وأشكال الأزرار في حالاتها المختلفة.`,en:`Create a mood board for an imaginary café app, then turn it into a style guide: a colour palette, two fonts, and button styles in their different states.`},deliverable:{ar:`رابط ملف Figma`,en:`A Figma link`}},{id:`ux-t3`,level:`intermediate`,title:{ar:`شخصية مستخدم ورحلة استخدام لمنصة مسار`,en:`Persona and user journey for the Masar platform`},description:{ar:`قابل 3 طلاب على الأقل واسألهم كيف اختاروا تخصصهم، ثم اصنع Persona واحدة وخريطة رحلة المستخدم (User Journey Map) من التسجيل حتى استلام خطة التطوير.`,en:`Interview at least 3 students about how they chose their field, then build one persona and a user journey map from sign-up to receiving the development plan.`},deliverable:{ar:`رابط FigJam أو ملف PDF يتضمن ملخص المقابلات`,en:`A FigJam link or PDF including a summary of the interviews`}},{id:`ux-t4`,level:`intermediate`,title:{ar:`من Wireframe إلى نموذج تفاعلي لطلب طعام`,en:`From wireframe to clickable prototype for food ordering`},description:{ar:`صمم رحلة طلب طعام من 4 شاشات (القائمة، تفاصيل الوجبة، السلة، تأكيد الطلب): ابدأ بـ Wireframes ثم حولها إلى تصميم عالي الدقة واربطها كنموذج تفاعلي.`,en:`Design a 4-screen food ordering flow (menu, meal details, cart, confirmation): start with wireframes, move to high-fidelity screens and link them as a clickable prototype.`},deliverable:{ar:`رابط النموذج التفاعلي في Figma`,en:`A Figma prototype link`}},{id:`ux-t5`,level:`advanced`,title:{ar:`اختبار قابلية الاستخدام وتحسين التصميم`,en:`Usability test and iteration`},description:{ar:`اختبر نموذجك مع 3 مستخدمين على الأقل باستخدام 3 مهام محددة، وسجّل أين ترددوا، ثم عدّل التصميم ووثّق النسخة قبل وبعد.`,en:`Test your prototype with at least 3 users on 3 defined tasks, record where they hesitated, then improve the design and document the before and after.`},deliverable:{ar:`تقرير قصير (PDF أو Notion) ورابط النسخة المحسّنة`,en:`A short report (PDF or Notion) and a link to the improved version`}},{id:`ux-t6`,level:`advanced`,title:{ar:`نظام تصميم مصغّر ودراسة حالة`,en:`Mini design system and case study`},description:{ar:`ابنِ نظام تصميم يضم 10 مكونات على الأقل (أزرار، حقول إدخال، بطاقات...) بحالاتها المختلفة باستخدام Variants و Auto Layout، ثم اكتب دراسة حالة لمشروعك تعرضها في معرض أعمالك.`,en:`Build a design system with at least 10 components (buttons, inputs, cards…) and their states using variants and Auto Layout, then write a case study you can show in your portfolio.`},deliverable:{ar:`رابط ملف Figma ورابط دراسة الحالة (Behance أو Notion أو PDF)`,en:`A Figma link and a case study link (Behance, Notion or PDF)`}}],plans:{beginner:{title:{ar:`خطة البداية في UI/UX`,en:`UI/UX starter plan`},summary:{ar:`هدفك الآن فهم أساسيات التصميم وإتقان Figma في الاستخدام اليومي.`,en:`Your goal now is to understand design basics and get comfortable with Figma.`},steps:[{id:`s1`,title:{ar:`تعلّم Figma من الصفر`,en:`Learn Figma from scratch`},details:{ar:`الإطارات، الأشكال، النصوص، المكونات، و Auto Layout. أعد رسم 3 شاشات من تطبيقات تستخدمها كما هي.`,en:`Frames, shapes, text, components and Auto Layout. Recreate 3 screens from apps you use exactly as they are.`}},{id:`s2`,title:{ar:`أساسيات التصميم البصري`,en:`Visual design basics`},details:{ar:`التسلسل البصري، المحاذاة، المسافات، الألوان، والخطوط. طبّقها في المهمة الثانية.`,en:`Visual hierarchy, alignment, spacing, colour and type. Apply them in task 2.`}},{id:`s3`,title:{ar:`قوانين تجربة المستخدم`,en:`Laws of UX`},details:{ar:`اقرأ قوانين Jakob و Fitts و Hick، واكتب مثالًا لكل قانون من تطبيق حقيقي.`,en:`Read Jakob's, Fitts's and Hick's laws and write one real-app example for each.`}},{id:`s4`,title:{ar:`نفّذ مهام المستوى المبتدئ`,en:`Complete the beginner tasks`},details:{ar:`سلّم المهمتين الأولى والثانية، ثم أعد اختبار المستوى بعد الانتهاء.`,en:`Submit tasks 1 and 2, then retake the level test when you are done.`}}]},intermediate:{title:{ar:`خطة المستوى المتوسط في UI/UX`,en:`UI/UX intermediate plan`},summary:{ar:`انتقل من الرسم إلى عملية تصميم كاملة تبدأ بفهم المستخدم.`,en:`Move from drawing screens to a full design process that starts with the user.`},steps:[{id:`s1`,title:{ar:`البحث مع المستخدمين`,en:`User research`},details:{ar:`تعلّم كتابة أسئلة مقابلة محايدة، وكيف تلخّص النتائج في Persona ورحلة مستخدم.`,en:`Learn to write neutral interview questions and summarise findings into a persona and journey map.`}},{id:`s2`,title:{ar:`بنية المعلومات`,en:`Information architecture`},details:{ar:`خرائط الموقع (Sitemaps)، ومخططات تدفق المستخدم (User Flows)، وفرز البطاقات.`,en:`Sitemaps, user flows and card sorting.`}},{id:`s3`,title:{ar:`النماذج التفاعلية`,en:`Interactive prototypes`},details:{ar:`اربط الشاشات في Figma مع الانتقالات و Smart Animate، ونفّذ المهمة الرابعة.`,en:`Link screens in Figma with transitions and Smart Animate, and complete task 4.`}},{id:`s4`,title:{ar:`إمكانية الوصول`,en:`Accessibility`},details:{ar:`راجع معايير WCAG الأساسية: التباين، حجم الأهداف، والنص البديل.`,en:`Review core WCAG criteria: contrast, target size and alternative text.`}}]},advanced:{title:{ar:`خطة المستوى المتقدم في UI/UX`,en:`UI/UX advanced plan`},summary:{ar:`ركّز على الاختبار والتحسين وبناء معرض أعمال يقنع جهات التوظيف.`,en:`Focus on testing, iteration and a portfolio that convinces employers.`},steps:[{id:`s1`,title:{ar:`اختبار قابلية الاستخدام`,en:`Usability testing`},details:{ar:`خطط لاختبار، نفّذه مع مستخدمين، وحوّل الملاحظات إلى تعديلات (المهمة الخامسة).`,en:`Plan a test, run it with users and turn findings into changes (task 5).`}},{id:`s2`,title:{ar:`أنظمة التصميم`,en:`Design systems`},details:{ar:`المكونات، الـ Variants، الـ Tokens، والتوثيق. نفّذ المهمة السادسة.`,en:`Components, variants, tokens and documentation. Complete task 6.`}},{id:`s3`,title:{ar:`التعاون مع المطورين`,en:`Working with developers`},details:{ar:`تعلّم أساسيات HTML و CSS لتفهم حدود التنفيذ، واستخدم وضع Dev Mode لتسليم التصميم.`,en:`Learn HTML and CSS basics to understand build limits, and use Dev Mode for handoff.`}},{id:`s4`,title:{ar:`معرض الأعمال`,en:`Portfolio`},details:{ar:`اكتب دراستي حالة على الأقل تعرض المشكلة والبحث والحل والنتيجة.`,en:`Write at least two case studies showing the problem, research, solution and outcome.`}}]}},resources:[{title:`Google UX Design Certificate`,url:`https://www.coursera.org/professional-certificates/google-ux-design`,lang:`en`,type:`course`},{title:`Figma Help Center`,url:`https://help.figma.com/`,lang:`en`,type:`docs`},{title:`Laws of UX`,url:`https://lawsofux.com/`,lang:`en`,type:`article`},{title:`Nielsen Norman Group Articles`,url:`https://www.nngroup.com/articles/`,lang:`en`,type:`article`},{title:`UX Design Roadmap`,url:`https://roadmap.sh/ux-design`,lang:`en`,type:`roadmap`},{title:`WCAG Quick Reference`,url:`https://www.w3.org/WAI/WCAG22/quickref/`,lang:`en`,type:`docs`}]},m={track:`frontend`,levelTest:[{id:`fe1`,difficulty:`easy`,q:{ar:`إلى ماذا يشير الاختصار HTML؟`,en:`What does HTML stand for?`},options:[{id:`a`,text:{ar:`HighText Machine Language`,en:`HighText Machine Language`}},{id:`b`,text:{ar:`Home Tool Markup Language`,en:`Home Tool Markup Language`}},{id:`c`,text:{ar:`HyperText Markup Language`,en:`HyperText Markup Language`}},{id:`d`,text:{ar:`Hyperlink Text Machine Language`,en:`Hyperlink Text Machine Language`}}],answer:`c`,explain:{ar:`HTML لغة ترميز تحدد هيكل صفحة الويب ومحتواها.`,en:`HTML is a markup language that defines the structure and content of a web page.`}},{id:`fe2`,difficulty:`easy`,q:{ar:`أي لغة تُستخدم لتنسيق شكل صفحة الويب؟`,en:`Which language is used to style a web page?`},options:[{id:`a`,text:{ar:`CSS`,en:`CSS`}},{id:`b`,text:{ar:`SQL`,en:`SQL`}},{id:`c`,text:{ar:`Python`,en:`Python`}},{id:`d`,text:{ar:`HTML`,en:`HTML`}}],answer:`a`,explain:{ar:`CSS مسؤولة عن الألوان والخطوط والتخطيط والمسافات.`,en:`CSS controls colours, fonts, layout and spacing.`}},{id:`fe3`,difficulty:`easy`,q:{ar:`أي وسم HTML يُستخدم لإنشاء رابط؟`,en:`Which HTML tag creates a link?`},options:[{id:`a`,text:{ar:`<link>`,en:`<link>`}},{id:`b`,text:{ar:`<href>`,en:`<href>`}},{id:`c`,text:{ar:`<url>`,en:`<url>`}},{id:`d`,text:{ar:`<a>`,en:`<a>`}}],answer:`d`,explain:{ar:`الوسم <a> مع الخاصية href ينشئ رابطًا. أما <link> فيربط ملفات مثل CSS.`,en:`<a> with an href attribute makes a link. <link> connects files such as CSS.`}},{id:`fe4`,difficulty:`easy`,q:{ar:`أي خاصية CSS تغيّر لون النص؟`,en:`Which CSS property changes the text colour?`},options:[{id:`a`,text:{ar:`font-color`,en:`font-color`}},{id:`b`,text:{ar:`color`,en:`color`}},{id:`c`,text:{ar:`text-color`,en:`text-color`}},{id:`d`,text:{ar:`background`,en:`background`}}],answer:`b`,explain:{ar:`الخاصية color تحدد لون النص، و background تحدد الخلفية.`,en:`color sets the text colour; background sets the background.`}},{id:`fe5`,difficulty:`easy`,q:{ar:`في JavaScript الحديثة، كيف تعرّف متغيرًا لن يُعاد إسناد قيمته؟`,en:`In modern JavaScript, how do you declare a variable that won't be reassigned?`},options:[{id:`a`,text:{ar:`let`,en:`let`}},{id:`b`,text:{ar:`var`,en:`var`}},{id:`c`,text:{ar:`const`,en:`const`}},{id:`d`,text:{ar:`static`,en:`static`}}],answer:`c`,explain:{ar:`const يمنع إعادة الإسناد، بينما let و var يسمحان بها.`,en:`const prevents reassignment; let and var allow it.`}},{id:`fe6`,difficulty:`medium`,q:{ar:"ماذا تفعل القاعدة `display: flex`؟",en:"What does `display: flex` do?"},options:[{id:`a`,text:{ar:`ترتّب العناصر الموجودة داخله في صف أو عمود`,en:`Lays out the element's children in a row or column`}},{id:`b`,text:{ar:`تخفي العنصر مع الإبقاء على المساحة التي يشغلها`,en:`Hides the element but keeps the space it takes up`}},{id:`c`,text:{ar:`تجعل العنصر يطفو إلى اليسار ليلتف النص حوله`,en:`Makes the element float left so text wraps around it`}},{id:`d`,text:{ar:`تضيف حركة ناعمة كلما تغيّر حجم العنصر`,en:`Adds a smooth animation whenever the element changes size`}}],answer:`a`,explain:{ar:`Flexbox يسهّل المحاذاة وتوزيع المسافات بين العناصر.`,en:`Flexbox makes alignment and spacing between items easy.`}},{id:`fe7`,difficulty:`medium`,q:{ar:"ما نتيجة `typeof []` في JavaScript؟",en:"What is the result of `typeof []` in JavaScript?"},options:[{id:`a`,text:{ar:`"array"`,en:`"array"`}},{id:`b`,text:{ar:`"list"`,en:`"list"`}},{id:`c`,text:{ar:`"undefined"`,en:`"undefined"`}},{id:`d`,text:{ar:`"object"`,en:`"object"`}}],answer:`d`,explain:{ar:"المصفوفات كائنات في JavaScript، ونستخدم `Array.isArray()` للتحقق منها.",en:"Arrays are objects in JavaScript; use `Array.isArray()` to check for one."}},{id:`fe8`,difficulty:`medium`,q:{ar:`أي دالة تضيف عنصرًا إلى نهاية المصفوفة؟`,en:`Which method adds an element to the end of an array?`},options:[{id:`a`,text:{ar:`pop()`,en:`pop()`}},{id:`b`,text:{ar:`push()`,en:`push()`}},{id:`c`,text:{ar:`shift()`,en:`shift()`}},{id:`d`,text:{ar:`unshift()`,en:`unshift()`}}],answer:`b`,explain:{ar:`push تضيف للنهاية، و pop تحذف من النهاية، و unshift تضيف للبداية.`,en:`push adds to the end, pop removes from the end, unshift adds to the start.`}},{id:`fe9`,difficulty:`medium`,q:{ar:`ما الـ DOM؟`,en:`What is the DOM?`},options:[{id:`a`,text:{ar:`قاعدة بيانات صغيرة داخل المتصفح يحفظ فيها كل موقع بياناته`,en:`A small database inside the browser where each website stores its own data`}},{id:`b`,text:{ar:`إطار عمل CSS يوفر تخطيطات جاهزة للصفحات`,en:`A CSS framework that provides ready-made page layouts`}},{id:`c`,text:{ar:`تمثيل شجري لعناصر الصفحة تستطيع JavaScript قراءته وتعديله`,en:`A tree representation of the page that JavaScript can read and change`}},{id:`d`,text:{ar:`الخادم الذي يستضيف ملفات الموقع`,en:`The server that hosts the site's files`}}],answer:`c`,explain:{ar:`من خلال الـ DOM نضيف العناصر ونغيّر النصوص ونستمع للأحداث.`,en:`Through the DOM we add elements, change text and listen for events.`}},{id:`fe10`,difficulty:`medium`,q:{ar:`في React، ما الـ props؟`,en:`In React, what are props?`},options:[{id:`a`,text:{ar:`أنماط عامة تشترك فيها كل مكونات التطبيق`,en:`Global styles shared by every component in the app`}},{id:`b`,text:{ar:`بيانات يحتفظ بها المكوّن ويغيّرها بنفسه`,en:`Data a component keeps and changes by itself`}},{id:`c`,text:{ar:`قيم يحفظها المتصفح كملفات تعريف ارتباط للمستخدم`,en:`Values the browser saves as cookies for the user`}},{id:`d`,text:{ar:`مدخلات يمررها المكوّن الأب إلى المكوّن الابن`,en:`Inputs passed from a parent component to a child`}}],answer:`d`,explain:{ar:`الـ props للقراءة فقط داخل المكوّن الابن، أما الحالة المتغيرة فنستخدم لها state.`,en:`Props are read-only inside the child; changing data uses state.`}},{id:`fe11`,difficulty:`hard`,q:{ar:"ماذا يقارن العامل `===` في JavaScript؟",en:"What does the `===` operator compare in JavaScript?"},options:[{id:`a`,text:{ar:`القيمة والنوع معًا دون تحويل`,en:`Value and type together, with no conversion`}},{id:`b`,text:{ar:`القيمة فقط، بعد تحويل الطرفين إلى النوع نفسه`,en:`Only the value, after converting both sides to the same type`}},{id:`c`,text:{ar:`يُسند قيمة لمتغير`,en:`It assigns a value to a variable`}},{id:`d`,text:{ar:`يقارن أطوال النصوص فقط`,en:`It only compares string lengths`}}],answer:`a`,explain:{ar:'مثلًا `5 == "5"` تعطي `true`، لكن `5 === "5"` تعطي `false`.',en:'For example `5 == "5"` is `true`, but `5 === "5"` is `false`.'}},{id:`fe12`,difficulty:`hard`,q:{ar:"متى يعمل `useEffect(() => {...}, [])` في React؟",en:"When does `useEffect(() => {...}, [])` run in React?"},options:[{id:`a`,text:{ar:`بعد كل إعادة رسم للمكوّن`,en:`After every render of the component`}},{id:`b`,text:{ar:`مرة واحدة بعد أول ظهور للمكوّن`,en:`Once, after the component first renders`}},{id:`c`,text:{ar:`مرة واحدة قبل أول ظهور للمكوّن`,en:`Once, before the component first renders`}},{id:`d`,text:{ar:`فقط عندما يضغط المستخدم على المكوّن`,en:`Only when the user clicks the component`}}],answer:`b`,explain:{ar:`المصفوفة الفارغة تعني عدم وجود اعتماديات، فيعمل مرة واحدة عند التركيب (وقد يعمل مرتين في وضع التطوير StrictMode).`,en:`An empty array means no dependencies, so it runs once on mount (twice in development StrictMode).`}},{id:`fe13`,difficulty:`hard`,q:{ar:`ما الفرق الأساسي بين let و var؟`,en:`What is the main difference between let and var?`},options:[{id:`a`,text:{ar:`لا يوجد فرق`,en:`There is no difference`}},{id:`b`,text:{ar:`var نطاقها الكتلة، و let نطاقها الدالة`,en:`var is block-scoped and let is function-scoped`}},{id:`c`,text:{ar:`let نطاقها الكتلة { }، و var نطاقها الدالة`,en:`let is block-scoped { }, var is function-scoped`}},{id:`d`,text:{ar:`let لا يمكن تغيير قيمتها`,en:`let cannot be changed`}}],answer:`c`,explain:{ar:`متغير let المعرّف داخل if أو for لا يُرى خارجها، بعكس var.`,en:`A let variable declared inside an if or for block is not visible outside it, unlike var.`}},{id:`fe14`,difficulty:`hard`,q:{ar:`أي محدد CSS له أعلى أولوية (Specificity)؟`,en:`Which CSS selector has the highest specificity?`},options:[{id:`a`,text:{ar:`.header`,en:`.header`}},{id:`b`,text:{ar:`header`,en:`header`}},{id:`c`,text:{ar:`*`,en:`*`}},{id:`d`,text:{ar:`#header`,en:`#header`}}],answer:`d`,explain:{ar:"ترتيب الأولوية: المعرّف `#` ثم الفئة `.` ثم اسم العنصر ثم المحدد العام `*`.",en:"Order: id `#`, then class `.`, then element name, then the universal selector `*`."}},{id:`fe15`,difficulty:`hard`,q:{ar:"ما القيمة التي يعيدها `[1, 2, 3].map(n => n * 2)`؟",en:"What does `[1, 2, 3].map(n => n * 2)` return?"},options:[{id:`a`,text:{ar:`[2, 4, 6]`,en:`[2, 4, 6]`}},{id:`b`,text:{ar:`12`,en:`12`}},{id:`c`,text:{ar:`[1, 2, 3]`,en:`[1, 2, 3]`}},{id:`d`,text:{ar:`undefined`,en:`undefined`}}],answer:`a`,explain:{ar:`map تنشئ مصفوفة جديدة بنتيجة الدالة على كل عنصر ولا تغيّر الأصلية.`,en:`map creates a new array with the function applied to each item and leaves the original unchanged.`}}],tasks:[{id:`fe-t1`,level:`beginner`,title:{ar:`صفحة تعريفية شخصية`,en:`Personal profile page`},description:{ar:`ابنِ صفحة تعريفية عنك باستخدام HTML و CSS فقط: صورة، نبذة، مهارات، وروابط تواصل. استخدم وسومًا دلالية (header, main, section, footer) واجعلها تعمل على الهاتف.`,en:`Build a page about yourself with HTML and CSS only: photo, bio, skills and contact links. Use semantic tags (header, main, section, footer) and make it work on mobile.`},deliverable:{ar:`رابط مستودع GitHub ورابط الصفحة على GitHub Pages`,en:`A GitHub repository link and a GitHub Pages link`}},{id:`fe-t2`,level:`beginner`,title:{ar:`قائمة مهام تفاعلية`,en:`Interactive to-do list`},description:{ar:`باستخدام JavaScript فقط: إضافة مهمة، حذفها، تعليمها كمكتملة، وحفظ القائمة في localStorage حتى لا تضيع عند تحديث الصفحة.`,en:`With plain JavaScript: add a task, delete it, mark it done, and save the list in localStorage so it survives a page refresh.`},deliverable:{ar:`رابط GitHub ورابط النسخة المنشورة`,en:`A GitHub link and a live link`}},{id:`fe-t3`,level:`intermediate`,title:{ar:`صفحة هبوط متجاوبة من تصميم Figma`,en:`Responsive landing page from a Figma design`},description:{ar:`اختر تصميم صفحة هبوط مجاني من Figma Community ونفّذه بدقة باستخدام Flexbox و Grid، بأسلوب Mobile-first، مع قائمة تنقل تعمل على الهاتف.`,en:`Pick a free landing page design from Figma Community and build it accurately with Flexbox and Grid, mobile-first, with a navigation menu that works on phones.`},deliverable:{ar:`رابط النسخة المنشورة ورابط التصميم الأصلي`,en:`A live link and the original design link`}},{id:`fe-t4`,level:`intermediate`,title:{ar:`تطبيق يستهلك API عامة`,en:`App that consumes a public API`},description:{ar:`ابنِ تطبيق طقس أو اقتباسات أو أفلام يجلب البيانات من API عامة باستخدام fetch و async/await، مع حالات التحميل والخطأ والبحث.`,en:`Build a weather, quotes or movies app that fetches data from a public API with fetch and async/await, including loading, error and search states.`},deliverable:{ar:`رابط GitHub ورابط النسخة المنشورة`,en:`A GitHub link and a live link`}},{id:`fe-t5`,level:`advanced`,title:{ar:`تطبيق React متعدد الصفحات`,en:`Multi-page React app`},description:{ar:`ابنِ كتالوج دورات مصغّر بـ React و React Router: صفحة قائمة مع بحث وتصفية، وصفحة تفاصيل، ومفضلة محفوظة. قسّم الواجهة إلى مكونات قابلة لإعادة الاستخدام.`,en:`Build a mini course catalogue with React and React Router: a list page with search and filters, a details page and saved favourites. Split the UI into reusable components.`},deliverable:{ar:`رابط GitHub ورابط النسخة المنشورة على Vercel أو Netlify`,en:`A GitHub link and a live link on Vercel or Netlify`}},{id:`fe-t6`,level:`advanced`,title:{ar:`تدقيق الأداء وإمكانية الوصول`,en:`Performance and accessibility audit`},description:{ar:`شغّل Lighthouse على أحد مشروعاتك، وسجّل النتائج، ثم أصلح المشكلات (الصور، التباين، النصوص البديلة، الترتيب الدلالي) وقارن النتائج قبل وبعد.`,en:`Run Lighthouse on one of your projects, record the scores, fix the issues (images, contrast, alt text, semantic order) and compare before and after.`},deliverable:{ar:`تقرير قصير بلقطات الشاشة قبل وبعد ورابط المشروع`,en:`A short report with before/after screenshots and the project link`}}],plans:{beginner:{title:{ar:`خطة البداية في Front-end`,en:`Front-end starter plan`},summary:{ar:`ابنِ أساسًا قويًا في HTML و CSS و JavaScript قبل أي إطار عمل.`,en:`Build a strong base in HTML, CSS and JavaScript before any framework.`},steps:[{id:`s1`,title:{ar:`HTML الدلالية`,en:`Semantic HTML`},details:{ar:`العناوين، القوائم، النماذج، الصور، والوسوم الدلالية. نفّذ المهمة الأولى.`,en:`Headings, lists, forms, images and semantic tags. Complete task 1.`}},{id:`s2`,title:{ar:`CSS والتخطيط`,en:`CSS and layout`},details:{ar:`نموذج الصندوق، Flexbox، Grid، ووحدات القياس، واستعلامات الوسائط للتجاوب.`,en:`The box model, Flexbox, Grid, units and media queries for responsiveness.`}},{id:`s3`,title:{ar:`أساسيات JavaScript`,en:`JavaScript basics`},details:{ar:`المتغيرات، الشروط، الحلقات، الدوال، المصفوفات، والتعامل مع الـ DOM والأحداث. نفّذ المهمة الثانية.`,en:`Variables, conditions, loops, functions, arrays, and working with the DOM and events. Complete task 2.`}},{id:`s4`,title:{ar:`Git و GitHub`,en:`Git and GitHub`},details:{ar:`احفظ كل مشروع في مستودع، وانشر صفحاتك على GitHub Pages.`,en:`Keep every project in a repository and publish your pages on GitHub `,text:{ar:`PUT`,en:`PUT`}}],answer:`c`,explain:{ar:`GET للقراءة، POST للإنشاء، PUT/PATCH للتعديل، DELETE للحذف.`,en:`GET reads, POST creates, PUT/PATCH updates, DELETE removes.`}},{id:`be3`,difficulty:`easy`,q:{ar:`ما قاعدة البيانات؟`,en:`What is a database?`},options:[{id:`a`,text:{ar:`نظام منظم لتخزين البيانات واسترجاعها`,en:`An organised system for storing and retrieving data`}},{id:`b`,text:{ar:`لغة برمجة تُستخدم لبناء خوادم الويب وواجهات API`,en:`A programming language used to build web servers and APIs`}},{id:`c`,text:{ar:`برنامج لتصفح المواقع على الإنترنت`,en:`A program for browsing websites on the internet`}},{id:`d`,text:{ar:`أداة لتصميم شاشات التطبيق`,en:`A tool for designing the screens of an app`}}],answer:`a`,explain:{ar:`أمثلة: MySQL و PostgreSQL (علائقية)، و MongoDB (مستندات).`,en:`Examples: MySQL and PostgreSQL (relational), MongoDB (document).`}},{id:`be4`,difficulty:`easy`,q:{ar:`إلى ماذا يشير الاختصار API؟`,en:`What does API stand for?`},options:[{id:`a`,text:{ar:`Advanced Program Internet`,en:`Advanced Program Internet`}},{id:`b`,text:{ar:`Applied Protocol Integration`,en:`Applied Protocol Integration`}},{id:`c`,text:{ar:`Automatic Page Index`,en:`Automatic Page Index`}},{id:`d`,text:{ar:`Application Programming Interface`,en:`Application Programming Interface`}}],answer:`d`,explain:{ar:`الـ API واجهة تسمح لبرنامجين بالتواصل وتبادل البيانات.`,en:`An API is an interface that lets two programs talk and exchange data.`}},{id:`be5`,difficulty:`easy`,q:{ar:`أي مما يلي بيئة تشغيل تُستخدم في الـ Back-end؟`,en:`Which of these is a runtime used for back-end work?`},options:[{id:`a`,text:{ar:`CSS`,en:`CSS`}},{id:`b`,text:{ar:`Node.js`,en:`Node.js`}},{id:`c`,text:{ar:`Figma`,en:`Figma`}},{id:`d`,text:{ar:`HTML`,en:`HTML`}}],answer:`b`,explain:{ar:`Node.js يشغّل JavaScript على الخادم خارج المتصفح.`,en:`Node.js runs JavaScript on the server, outside the browser.`}},{id:`be6`,difficulty:`medium`,q:{ar:`ماذا يعني رمز الحالة HTTP 404؟`,en:`What does HTTP status code 404 mean?`},options:[{id:`a`,text:{ar:`حدث خطأ غير متوقع في الخادم`,en:`The server hit an unexpected error`}},{id:`b`,text:{ar:`نجح الطلب وأُعيدت البيانات`,en:`The request succeeded and data was returned`}},{id:`c`,text:{ar:`المورد المطلوب غير موجود`,en:`The requested resource was not found`}},{id:`d`,text:{ar:`يجب تسجيل الدخول للوصول إلى هذا المورد`,en:`You must log in to access this resource`}}],answer:`c`,explain:{ar:`200 نجاح، 401 غير مصرح، 404 غير موجود، 500 خطأ في الخادم.`,en:`200 success, 401 unauthorised, 404 not found, 500 server error.`}},{id:`be7`,difficulty:`medium`,q:{ar:`ما الفرق الأساسي بين قواعد بيانات SQL و NoSQL؟`,en:`What is the main difference between SQL and NoSQL databases?`},options:[{id:`a`,text:{ar:`SQL تستخدم جداول بمخطط ثابت، و NoSQL تسمح بصيغ مرنة مثل المستندات`,en:`SQL uses tables with a fixed schema; NoSQL allows flexible formats`}},{id:`b`,text:{ar:`قواعد SQL أحدث وحلّت محل قواعد NoSQL`,en:`SQL databases are newer and replaced NoSQL databases`}},{id:`c`,text:{ar:`قواعد NoSQL لا تستطيع تخزين العلاقات ولا يمكن الاستعلام منها`,en:`NoSQL databases cannot store relationships or be queried`}},{id:`d`,text:{ar:`SQL تعمل على خوادم السحابة فقط، بينما NoSQL تعمل على الأجهزة المحلية فقط`,en:`SQL runs only on cloud servers, while NoSQL runs only on local machines`}}],answer:`a`,explain:{ar:`مثلًا MongoDB تخزن مستندات تشبه JSON، بينما MySQL تخزن صفوفًا في جداول.`,en:`For example MongoDB stores JSON-like documents while MySQL stores rows in tables.`}},{id:`be8`,difficulty:`medium`,q:{ar:`لماذا نخزن كلمات المرور بعد تشفيرها بدالة Hash؟`,en:`Why do we hash passwords before storing them?`},options:[{id:`a`,text:{ar:`لجعلها أقصر حتى تشغل مساحة أقل`,en:`To make them shorter so they take less space`}},{id:`b`,text:{ar:`لتسريع تسجيل الدخول عندما يكثر المستخدمون`,en:`To make login faster when there are many users`}},{id:`c`,text:{ar:`ليستطيع المدير الاطلاع عليها وإرسالها للمستخدمين الذين ينسونها`,en:`So the admin can look them up and send them to users who forget them`}},{id:`d`,text:{ar:`حتى لا تنكشف كلمات المرور الأصلية لو تسربت قاعدة البيانات`,en:`So the original passwords aren't exposed if the database leaks`}}],answer:`d`,explain:{ar:`نستخدم خوارزميات مثل bcrypt التي يصعب عكسها وتضيف ملحًا (Salt) عشوائيًا.`,en:`We use algorithms like bcrypt that are hard to reverse and add a random salt.`}},{id:`be9`,difficulty:`medium`,q:{ar:`في Express.js، ما الـ Middleware؟`,en:`In Express.js, what is middleware?`},options:[{id:`a`,text:{ar:`قاعدة بيانات تقع بين الخادم والعميل`,en:`A database that sits between the server and the client`}},{id:`b`,text:{ar:`دالة تعمل بين استقبال الطلب وإرسال الرد`,en:`A function that runs between the request and the response`}},{id:`c`,text:{ar:`مكتبة واجهات أمامية تربط React بالخادم`,en:`A front-end library that connects React to the server`}},{id:`d`,text:{ar:`جهاز شبكة فعلي يوزّع الطلبات بين عدة خوادم`,en:`A physical network device that balances traffic between several servers`}}],answer:`b`,explain:{ar:`يُستخدم للتحقق من الهوية وتسجيل الطلبات وقراءة JSON ومعالجة الأخطاء.`,en:`It is used for authentication, logging, parsing JSON and handling errors.`}},{id:`be10`,difficulty:`medium`,q:{ar:`ماذا يعني REST في تصميم الـ APIs؟`,en:`What does REST mean in API design?`},options:[{id:`a`,text:{ar:`محرك قواعد بيانات مصمم للقراءة السريعة`,en:`A database engine designed for fast reads`}},{id:`b`,text:{ar:`لغة برمجة لكتابة كود الخوادم`,en:`A programming language for writing server code`}},{id:`c`,text:{ar:`أسلوب معماري يعتمد على الموارد وطرق HTTP القياسية`,en:`An architectural style built on resources and standard HTTP methods`}},{id:`d`,text:{ar:`بروتوكول أمان يشفّر كل البيانات بين العميل والخادم`,en:`A security protocol that encrypts all data between the client and server`}}],answer:`c`,explain:{ar:"مثلًا `GET /users` لجلب المستخدمين و `POST /users` لإضافة مستخدم.",en:"For example `GET /users` lists users and `POST /users` adds one."}},{id:`be11`,difficulty:`hard`,q:{ar:`فيمَ يُستخدم JWT عادةً؟`,en:`What is a JWT commonly used for?`},options:[{id:`a`,text:{ar:`إثبات هوية المستخدم في الطلبات برمز موقّع`,en:`Proving the user's identity in requests with a signed token`}},{id:`b`,text:{ar:`تخزين صور المستخدمين وملفاتهم على الخادم`,en:`Storing user images and files on the server`}},{id:`c`,text:{ar:`تشفير قاعدة البيانات كلها حتى لا يستطيع أحد قراءتها لو تسربت`,en:`Encrypting the whole database so that nobody can read it if it leaks`}},{id:`d`,text:{ar:`عمل نسخ احتياطية يومية تلقائية من قاعدة البيانات`,en:`Making automatic daily backups of the database`}}],answer:`a`,explain:{ar:`الخادم يوقّع الرمز بمفتاح سري، فيستطيع لاحقًا التأكد أنه لم يُعدَّل.`,en:`The server signs the token with a secret key, so it can later verify it wasn't changed.`}},{id:`be12`,difficulty:`hard`,q:{ar:`ما هجوم حقن SQL (SQL Injection)؟`,en:`What is an SQL injection attack?`},options:[{id:`a`,text:{ar:`تحميل ملفات CSS إضافية في الصفحة لتغيير شكلها`,en:`Loading extra CSS files into a page to change its look`}},{id:`b`,text:{ar:`إغراق الخادم بالطلبات حتى يتوقف عن الاستجابة`,en:`Flooding the server with requests until it stops responding`}},{id:`c`,text:{ar:`إخفاء فيروس داخل الصور المرفوعة لإصابة الخادم`,en:`Hiding a virus inside uploaded images to infect the server`}},{id:`d`,text:{ar:`إدخال أوامر SQL عبر مدخلات المستخدم للتلاعب بقاعدة البيانات`,en:`Sending SQL through user input to manipulate the database`}}],answer:`d`,explain:{ar:`الحل: الاستعلامات المُعدّة مسبقًا (Parameterized Queries) وعدم دمج المدخلات في النص مباشرة.`,en:`The fix: parameterised queries instead of pasting input into the query text.`}},{id:`be13`,difficulty:`hard`,q:{ar:`ما فائدة الفهرس (Index) في قاعدة البيانات؟`,en:`What is a database index for?`},options:[{id:`a`,text:{ar:`تشفير الأعمدة الحساسة في الجدول`,en:`Encrypting the sensitive columns in a table`}},{id:`b`,text:{ar:`تسريع البحث مقابل مساحة تخزين إضافية`,en:`Speeding up searches, at the cost of extra storage`}},{id:`c`,text:{ar:`الاحتفاظ بنسخة احتياطية تلقائية من كل جدول تحسبًا لأي عطل`,en:`Keeping an automatic backup copy of each table in case of failure`}},{id:`d`,text:{ar:`ترتيب الصفوف على الشاشة للمستخدم`,en:`Sorting the rows on screen for the user`}}],answer:`b`,explain:{ar:`يشبه فهرس الكتاب: تصل للمعلومة بدون قراءة كل الصفحات.`,en:`Like a book's index: you reach the information without reading every page.`}},{id:`be14`,difficulty:`hard`,q:{ar:`ما رمز الحالة المناسب بعد إنشاء مورد جديد بنجاح عبر POST؟`,en:`Which status code fits after successfully creating a resource with POST?`},options:[{id:`a`,text:{ar:`200`,en:`200`}},{id:`b`,text:{ar:`204`,en:`204`}},{id:`c`,text:{ar:`201`,en:`201`}},{id:`d`,text:{ar:`301`,en:`301`}}],answer:`c`,explain:{ar:`201 Created تعني أن موردًا جديدًا أُنشئ، و204 تعني نجاحًا بلا محتوى.`,en:`201 Created means a new resource was made; 204 means success with no content.`}},{id:`be15`,difficulty:`hard`,q:{ar:"لماذا نستخدم متغيرات البيئة (`.env`) للمعلومات السرية؟",en:"Why use environment variables (`.env`) for secrets?"},options:[{id:`a`,text:{ar:`لإبقاء المفاتيح وكلمات المرور خارج الكود المصدري`,en:`To keep keys and passwords out of the source code`}},{id:`b`,text:{ar:`لجعل الخادم يعمل أسرع عند النشر`,en:`To make the server run faster in production`}},{id:`c`,text:{ar:`لتشفير الأسرار تلقائيًا داخل الكود`,en:`To encrypt the secrets automatically inside the code`}},{id:`d`,text:{ar:`لأن Node.js لا تستطيع قراءة الأسرار من ملفات الكود`,en:`Because Node.js cannot read secrets from code files`}}],answer:`a`,explain:{ar:`وبذلك لا تُرفع الأسرار إلى GitHub، ويمكن تغييرها لكل بيئة تشغيل.`,en:`That way secrets never reach GitHub and can differ per environment.`}}],tasks:[{id:`be-t1`,level:`beginner`,title:{ar:`أول خادم Node.js`,en:`Your first Node.js server`},description:{ar:"أنشئ خادمًا بـ Express فيه 3 مسارات تعيد JSON: `/hello` و `/time` و `/about`. أضف مسارًا يستقبل اسمًا في الرابط ويرحّب به.",en:"Create an Express server with 3 routes that return JSON: `/hello`, `/time` and `/about`. Add a route T and JOIN). Complete task 3.`}},{id:`s2`,title:{ar:`المصادقة`,en:`Authentication`},details:{ar:`bcrypt و JWT وحماية المسارات. نفّذ المهمة الرابعة.`,en:`bcrypt, JWT and protected routes. Complete task 4.`}},{id:`s3`,title:{ar:`تصميم APIs جيدة`,en:`Good API design`},details:{ar:`أسماء الموارد، رموز الحالة، التحقق من المدخلات، ورسائل الأخطاء.`,en:`Resource naming, status codes, input validation and error messages.`}},{id:`s4`,title:{ar:`أساسيات الأمان`,en:`Security basics`},details:{ar:`اقرأ قائمة OWASP Top 10 وطبّق ما يناسب مشروعك.`,en:`Read the OWASP Top 10 and apply what fits your project.`}}]},advanced:{title:{ar:`خطة المستوى المتقدم في Back-end`,en:`Back-end advanced plan`},summary:{ar:`ابنِ أنظمة قابلة للنشر والتوسع والصيانة.`,en:`Build systems that are deployable, scalable and maintainable.`},steps:[{id:`s1`,title:{ar:`هيكلة المشروع`,en:`Project structure`},details:{ar:`فصل المسارات والخدمات والنماذج، والصلاحيات والتقسيم إلى صفحات. نفّذ المهمة الخامسة.`,en:`Separate routes, services and models; add roles and pagination. Complete task 5.`}},{id:`s2`,title:{ar:`الاختبارات`,en:`Testing`},details:{ar:`اختبارات الوحدة والتكامل باستخدام Jest أو Vitest مع Supertest.`,en:`Unit and integration tests with Jest or Vitest and Supertest.`}},{id:`s3`,title:{ar:`النشر`,en:`Deployment`},details:{ar:`Render و MongoDB Atlas ومتغيرات البيئة وسجلات الأخطاء. نفّذ المهمة السادسة.`,en:`Render, MongoDB Atlas, environment variables and logs. Complete task 6.`}},{id:`s4`,title:{ar:`الأداء والتوسع`,en:`Performance and scale`},details:{ar:`الفهارس، والتخزين المؤقت (Caching)، وأساسيات Docker.`,en:`Indexes, caching and Docker basics.`}}]}},resources:[{title:`Node.js Learn`,url:`https://nodejs.org/en/learn`,lang:`en`,type:`docs`},{title:`Express.js`,url:`https://expressjs.com/`,lang:`en`,type:`docs`},{title:`MongoDB University`,url:`https://learn.mongodb.com/`,lang:`en`,type:`course`},{title:`Elzero Web School`,url:`https://www.youtube.com/@ElzeroWebSchool`,lang:`ar`,type:`video`},{title:`OWASP Top 10`,url:`https://owasp.org/www-project-top-ten/`,lang:`en`,type:`article`},{title:`Backend Roadmap`,url:`https://roadmap.sh/backend`,lang:`en`,type:`roadmap`}]},g={track:`data`,levelTest:[{id:`da1`,difficulty:`easy`,q:{ar:`ما المتوسط الحسابي للأعداد 2، 4، 6، 8؟`,en:`What is the mean of 2, 4, 6, 8?`},options:[{id:`a`,text:{ar:`4`,en:`4`}},{id:`b`,text:{ar:`6`,en:`6`}},{id:`c`,text:{ar:`5`,en:`5`}},{id:`d`,text:{ar:`20`,en:`20`}}],answer:`c`,explain:{ar:`المجموع 20 مقسومًا على 4 قيم = 5.`,en:`The sum 20 divided by 4 values = 5.`}},{id:`da2`,difficulty:`easy`,q:{ar:`أي مكتبة Python هي الأشهر للتعامل مع الجداول (DataFrames)؟`,en:`Which Python library is best known for working with tables (DataFrames)?`},options:[{id:`a`,text:{ar:`pandas`,en:`pandas`}},{id:`b`,text:{ar:`React`,en:`React`}},{id:`c`,text:{ar:`Express`,en:`Express`}},{id:`d`,text:{ar:`Figma`,en:`Figma`}}],answer:`a`,explain:{ar:`pandas توفر DataFrame لقراءة البيانات وتنظيفها وتحليلها.`,en:`pandas provides the DataFrame for reading, cleaning and analysing data.`}},{id:`da3`,difficulty:`easy`,q:{ar:`أي رسم بياني هو الأنسب لعرض اتجاه قيمة عبر الزمن؟`,en:`Which chart is best for showing a trend over time?`},options:[{id:`a`,text:{ar:`الرسم الدائري`,en:`Pie chart`}},{id:`b`,text:{ar:`سحابة الكلمات`,en:`Word cloud`}},{id:`c`,text:{ar:`الخريطة`,en:`Map`}},{id:`d`,text:{ar:`الرسم الخطي`,en:`Line chart`}}],answer:`d`,explain:{ar:`الرسم الخطي يوضح الصعود والهبوط بين النقاط الزمنية المتتالية.`,en:`A line chart shows rises and falls across consecutive points in time.`}},{id:`da4`,difficulty:`easy`,q:{ar:`ما ملف CSV؟`,en:`What is a CSV file?`},options:[{id:`a`,text:{ar:`صيغة صور مضغوطة تُستخدم في التقارير`,en:`A compressed image format used in reports`}},{id:`b`,text:{ar:`جدول في ملف نصي تفصل الفواصل بين قيمه`,en:`A plain-text table whose values are separated by commas`}},{id:`c`,text:{ar:`ملف جداول يحفظ المعادلات والتنسيق والرسوم البيانية`,en:`A spreadsheet file that stores formulas, formatting and charts`}},{id:`d`,text:{ar:`برنامج Python ينظف البيانات تلقائيًا`,en:`A Python script that cleans data automatically`}}],answer:`b`,explain:{ar:"CSV صيغة بسيطة يفتحها Excel وتقرؤها pandas بالدالة `read_csv`.",en:"CSV is a simple format Excel opens and pandas reads with `read_csv`."}},{id:`da5`,difficulty:`easy`,q:{ar:"ماذا يفعل الأمر `SELECT` في SQL؟",en:"What does `SELECT` do in SQL?"},options:[{id:`a`,text:{ar:`يحذف صفوفًا من جدول`,en:`Deletes rows from a table`}},{id:`b`,text:{ar:`ينشئ جدولًا جديدًا`,en:`Creates a new table`}},{id:`c`,text:{ar:`يجلب البيانات من جدول`,en:`Retrieves data from a table`}},{id:`d`,text:{ar:`يعدّل القيم في جدول`,en:`Changes values in a table`}}],answer:`c`,explain:{ar:"مثال: `SELECT name, grade FROM students;`",en:"Example: `SELECT name, grade FROM students;`"}},{id:`da6`,difficulty:`medium`,q:{ar:`ما الوسيط (Median) للقيم 1، 2، 3، 10، 20؟`,en:`What is the median of 1, 2, 3, 10, 20?`},options:[{id:`a`,text:{ar:`7.2`,en:`7.2`}},{id:`b`,text:{ar:`3`,en:`3`}},{id:`c`,text:{ar:`10`,en:`10`}},{id:`d`,text:{ar:`2`,en:`2`}}],answer:`b`,explain:{ar:`الوسيط هو القيمة في المنتصف بعد الترتيب = 3، أما المتوسط فهو 7.2.`,en:`The median is the middle value after sorting = 3; the mean is 7.2.`}},{id:`da7`,difficulty:`medium`,q:{ar:"ماذا يعرض `df.isnull().sum()` في pandas؟",en:"What does `df.isnull().sum()` show in pandas?"},options:[{id:`a`,text:{ar:`عدد القيم المفقودة في كل عمود`,en:`The number of missing values in each column`}},{id:`b`,text:{ar:`مجموع كل القيم في كل عمود`,en:`The sum of all the values in each column`}},{id:`c`,text:{ar:`عدد الصفوف في الجدول كله`,en:`The number of rows in the whole table`}},{id:`d`,text:{ar:`يحذف القيم المفقودة من الجدول`,en:`It removes the missing values from the table`}}],answer:`a`,explain:{ar:`isnull تعطي True مكان كل قيمة مفقودة، و sum تعدّها لكل عمود.`,en:`isnull marks each missing value as True, and sum counts them per column.`}},{id:`da8`,difficulty:`medium`,q:{ar:`ما القيمة الشاذة (Outlier)؟`,en:`What is an outlier?`},
